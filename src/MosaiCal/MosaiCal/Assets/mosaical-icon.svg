<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="mosaical-title">
  <title id="mosaical-title">MosaiCal</title>

  <!-- Base: rounded square with a thin edge -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#D6DCFF"/>
  <rect x="11" y="11" width="234" height="234" rx="53" fill="#F1F4FF"/>

  <!-- Header bar and binder-ring tabs -->
  <rect x="36" y="44" width="184" height="40" rx="12" fill="#3B5BFF"/>
  <rect x="76" y="26" width="14" height="30" rx="7" fill="#232B6B"/>
  <rect x="166" y="26" width="14" height="30" rx="7" fill="#232B6B"/>

  <!-- Event tile 1: date + title on one line -->
  <rect x="36" y="96" width="184" height="30" rx="12" fill="#7C4DFF"/>
  <rect x="50" y="107" width="24" height="8" rx="4" fill="#FFFFFF"/>
  <rect x="84" y="107" width="118" height="8" rx="4" fill="#FFFFFF" opacity="0.75"/>

  <!-- Event tile 2: long title wraps to a second line -->
  <rect x="36" y="135" width="184" height="46" rx="12" fill="#FFB020"/>
  <rect x="50" y="147" width="24" height="8" rx="4" fill="#232B6B"/>
  <rect x="84" y="147" width="122" height="8" rx="4" fill="#232B6B" opacity="0.7"/>
  <rect x="84" y="161" width="64" height="8" rx="4" fill="#232B6B" opacity="0.7"/>

  <!-- Event tile 3: date + title on one line -->
  <rect x="36" y="190" width="184" height="30" rx="12" fill="#FF6B6B"/>
  <rect x="50" y="201" width="24" height="8" rx="4" fill="#232B6B"/>
  <rect x="84" y="201" width="86" height="8" rx="4" fill="#232B6B" opacity="0.7"/>
</svg>
